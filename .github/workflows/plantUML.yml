name: Build PlantUML diagrams

on:
  push:
    branches:
      - main
    paths:
      - "docs/diagrams/**"
      - ".github/workflows/plantuml.yml"

  pull_request:
    paths:
      - "docs/diagrams/**"

jobs:
  diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Java and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre graphviz

      - name: Download PlantUML
        run: |
          wget https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Check PlantUML syntax
        run: |
          java -jar plantuml.jar --check-syntax docs/diagrams

      - name: Generate SVG diagrams
        run: |
          java -jar plantuml.jar --svg "docs/diagrams/*.puml"

      - name: Upload diagrams
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: docs/diagrams/*.svg
